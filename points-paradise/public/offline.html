<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Points &amp; Paradise</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f8f4ec; color: #18202e; }
  @media (prefers-color-scheme: dark) { body { background: #0b1422; color: #ece6d9; } }
  main { max-width: 26rem; padding: 2rem; text-align: center; }
  h1 { font-family: Georgia, serif; font-weight: 500; }
  p { opacity: .75; line-height: 1.5; }
  button { margin-top: 1rem; padding: .6rem 1.2rem; border-radius: 999px; border: 0; background: #2f6f6c; color: #fff; font-size: 1rem; }
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>Points &amp; Paradise needs a connection to load deals and verify availability. Nothing shown while offline should be treated as current.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
