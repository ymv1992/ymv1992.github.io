name: Points & Paradise CI

on:
  push:
    paths: ['points-paradise/**', '.github/workflows/points-paradise-ci.yml']
  pull_request:
    paths: ['points-paradise/**', '.github/workflows/points-paradise-ci.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Real Postgres for the database tests, so driver-specific bugs (not seen
      # with the embedded PGlite) fail CI instead of production.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: points-paradise
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: points-paradise/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Database and job tests on Postgres
        run: npx vitest run tests/db tests/jobs
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - run: npm run build
        env:
          # The build never touches the database (all pages are dynamic); this
          # placeholder only satisfies the production configuration check.
          SESSION_SECRET: ci-only-placeholder-session-secret-0123456789
