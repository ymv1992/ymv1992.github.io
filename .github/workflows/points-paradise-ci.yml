name: Points & Paradise CI

on:
  push:
    paths: ['points-paradise/**', '.github/workflows/points-paradise-ci.yml']
  pull_request:
    paths: ['points-paradise/**', '.github/workflows/points-paradise-ci.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: points-paradise
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: points-paradise/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # The build never touches the database (all pages are dynamic); this
          # placeholder only satisfies the production configuration check.
          SESSION_SECRET: ci-only-placeholder-session-secret-0123456789
